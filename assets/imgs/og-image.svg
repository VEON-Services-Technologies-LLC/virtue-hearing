<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Virtue Hearing Aid Center — Hearing aids in Montebello, CA. Free consultations, Medicare accepted, 0% financing.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcf5eb"/>
      <stop offset="100%" stop-color="#f6e6cf"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f48e27"/>
      <stop offset="100%" stop-color="#ec1f24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#f48e27" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f48e27" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative wave -->
  <g transform="translate(900, 320)" opacity="0.18">
    <circle cx="0" cy="0" r="220" fill="none" stroke="#f48e27" stroke-width="3"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#f48e27" stroke-width="3"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#f48e27" stroke-width="3"/>
    <circle cx="0" cy="0" r="40" fill="#f48e27"/>
  </g>

  <!-- Tag pill -->
  <g transform="translate(80, 110)">
    <rect width="240" height="40" rx="20" fill="#f48e27" fill-opacity="0.18"/>
    <text x="120" y="26" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#d67314" text-anchor="middle" letter-spacing="2">MONTEBELLO, CA</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 200)" font-family="Georgia, 'Playfair Display', serif" fill="#433a39">
    <text x="0" y="0" font-size="78" font-weight="900">Virtue Hearing</text>
    <text x="0" y="90" font-size="78" font-weight="900">Aid Center</text>
    <text x="0" y="160" font-size="36" font-style="italic" fill="#f48e27">Hear Every Precious Moment</text>
  </g>

  <!-- Bullets -->
  <g transform="translate(80, 470)" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#433a39" font-weight="500">
    <text x="0" y="0">✓ Free consultations</text>
    <text x="220" y="0">✓ Medicare accepted</text>
    <text x="470" y="0">✓ 0% financing</text>
  </g>

  <!-- CTA bar -->
  <g transform="translate(80, 530)">
    <rect width="320" height="56" rx="28" fill="url(#accent)"/>
    <text x="160" y="36" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Call (323) 530-0223</text>
  </g>

  <!-- Footer URL -->
  <text x="1120" y="600" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#6e5f5a" text-anchor="end" font-weight="500">virtuehearing.com</text>
</svg>
